name: flutter_demo_app
description: "Smart Governance Citizen App"

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management
  provider: ^6.1.5+1

  # Fonts
  google_fonts: ^6.2.1

  # Charts
  fl_chart: ^1.2.0

  # Maps
  flutter_map: ^8.3.0
  latlong2: ^0.9.1

  # Caching & Offline Support
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  connectivity_plus: ^6.0.3

  # Supabase & Environment
  supabase_flutter: ^2.5.3
  flutter_dotenv: ^5.1.0

  # GPS & Location
  geolocator: ^13.0.4
  geocoding: ^3.0.0

  # Image Picker (real camera/gallery)
  image_picker: ^1.1.2
  path_provider: ^2.1.3

  # URL Launcher (phone dialer)
  url_launcher: ^6.3.1

  # Speech to Text & Video Player for accessibility
  speech_to_text: ^7.4.0
  video_player: ^2.8.6
  excel: ^4.0.6
  share_plus: ^12.0.2
  record: ^7.0.0
  intl: ^0.20.2
  http: ^1.2.0
  file_picker: ^11.0.2
  uuid: ^4.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - supabase.env
    - assets/images/

  # Fonts Example
  # fonts:
  #   - family: Poppins
  #     fonts:
  #       - asset: assets/fonts/Poppins-Regular.ttf